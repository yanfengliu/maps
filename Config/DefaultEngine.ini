; Opening the uproject and pressing Play must show the town, so both of these
; name the built level rather than an engine map. On a clean checkout the level
; does not exist until build_level.py has run; FMedievalCityRuntimeModule checks
; for it at startup and says which commands build it.
[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/MedievalCity.MedievalCity
GameDefaultMap=/Game/Maps/MedievalCity.MedievalCity
GlobalDefaultGameMode=/Script/MedievalCityRuntime.MedievalGameMode

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bFilterInputByPlatformUser=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
Compiler=Default
AudioSampleRate=48000

[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
; Exposure is fixed, not adaptive, so two captures of the same town are comparable
; and a shadowed street reads darker than a sunlit one instead of each frame being
; normalised on its own. AutoExposure=False locks the white point at luminance 1
; and ExtendDefaultLuminanceRange=False pins those legacy units rather than
; inheriting them.
;
; The bias is the calibration. The engine default of 1.0 is a whole stop of extra
; brightness, which left sunlit ground rendering far above its albedo: M_Cobble is
; recorded at 0.36 but the sunlit plaza measured 0.62 display-linear (206 of 255).
; Measured with the ground-band p90 that tools/medieval/run_probe.py prints.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=False
r.DefaultFeature.AutoExposure.Bias=-0.5
r.DefaultFeature.MotionBlur=False
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
DefaultTerminalVelocity=4000.000000
